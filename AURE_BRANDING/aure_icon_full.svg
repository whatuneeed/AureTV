<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#071a3d"/>
      <stop offset="0.42" stop-color="#070b22"/>
      <stop offset="0.78" stop-color="#08081c"/>
      <stop offset="1" stop-color="#0d0722"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="18%" cy="12%" r="82%">
      <stop offset="0" stop-color="#2f78ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1d4bd8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1d4bd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="95%" cy="70%" r="75%">
      <stop offset="0" stop-color="#a62dff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#6d1dcc" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6d1dcc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b7bff" stop-opacity="0.03"/>
      <stop offset="0.3" stop-color="#4e86ff" stop-opacity="0.24"/>
      <stop offset="0.62" stop-color="#8a55ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="frontRibbon" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0" stop-color="#2c7cff" stop-opacity="0.12"/>
      <stop offset="0.2" stop-color="#347dff" stop-opacity="0.9"/>
      <stop offset="0.48" stop-color="#5c5cff" stop-opacity="0.96"/>
      <stop offset="0.72" stop-color="#943dff" stop-opacity="0.92"/>
      <stop offset="0.9" stop-color="#d26bff" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#ffb0ff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="ribbonShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.36" stop-color="#bcd7ff" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#f0e5ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.2" stop-color="#d9b8ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#02030b" stop-opacity="0"/>
      <stop offset="1" stop-color="#02030b" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="squircle">
      <rect x="24" y="24" width="976" height="976" rx="238"/>
    </clipPath>
  </defs>

  <g>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#blueGlow)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#purpleGlow)"/>

    <!-- rear glass ribbon -->
    <path d="M-130 730 C 230 500, 560 470, 1140 190"
          fill="none" stroke="url(#backRibbon)" stroke-width="180" stroke-linecap="round"/>
    <path d="M-130 730 C 230 500, 560 470, 1140 190"
          fill="none" stroke="#b9d4ff" stroke-width="5" stroke-opacity="0.10" filter="url(#softSmall)"/>

    <!-- front glass ribbon -->
    <path d="M-170 930 C 210 650, 610 590, 1160 300"
          fill="none" stroke="url(#frontRibbon)" stroke-width="300" stroke-linecap="round"/>
    <path d="M-170 930 C 210 650, 610 590, 1160 300"
          fill="none" stroke="url(#ribbonShine)" stroke-width="10" stroke-opacity="0.42" filter="url(#softSmall)"/>
    <path d="M-150 900 C 220 625, 610 565, 1140 280"
          fill="none" stroke="#eadfff" stroke-width="2.5" stroke-opacity="0.20"/>

    <rect x="0" y="0" width="1024" height="1024" fill="url(#bottomShade)"/>

    <!-- sparkle -->
    <path d="M772 166
             C 784 214, 800 230, 848 242
             C 800 254, 784 270, 772 318
             C 760 270, 744 254, 696 242
             C 744 230, 760 214, 772 166 Z"
          fill="#ffffff"/>
    <circle cx="772" cy="242" r="4" fill="#ffffff"/>
  </g>

</svg>
